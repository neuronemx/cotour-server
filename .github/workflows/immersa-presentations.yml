name: Immersa Presentations

on:
  pull_request:
    paths:
      - "immersa-presentations/**"
      - ".github/workflows/immersa-presentations.yml"

jobs:
  server-checks:
    name: Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: immersa-presentations

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare lockfile for npm ci
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install PDF conversion tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Run tests
        run: npm test

      - name: Check server syntax
        run: node --check server.js

      - name: Check raffle store syntax
        run: node --check raffle-store.js

      - name: Check raffle controller syntax
        run: node --check public/shared/raffle-controller.js

      - name: Check public raffle UI syntax
        run: node --check public/shared/raffle-public-ui.js

      - name: Check raffle UX adjustments syntax
        run: node --check public/shared/raffle-ux-adjustments.js

      - name: Check slide confirm syntax
        run: node --check public/shared/slide-confirm.js

      - name: Check interaction store syntax
        run: node --check interaction-store.js

      - name: Check active interaction coordinator syntax
        run: node --check active-interaction-coordinator.js

      - name: Check Breakout store syntax
        run: node --check breakout-store.js

      - name: Check Breakout socket syntax
        run: node --check breakout-sockets.js

      - name: Check Breakout UI syntax
        run: node --check public/shared/breakout-ui.js

      - name: Check presentation runtime syntax
        run: node --check public/shared/presentation-runtime.js

  events-v2-integration:
    name: Events v2 database and access isolation (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: 'mariadb:11.4'
            healthcheck: 'healthcheck.sh --connect --innodb_initialized'
          - database: 'mysql:9.7.2'
            healthcheck: 'mysqladmin ping -h 127.0.0.1 -uroot -pisolated-ci-password'
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-password
          MARIADB_DATABASE: events_v2_test
          MYSQL_ROOT_PASSWORD: isolated-ci-password
          MYSQL_DATABASE: events_v2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.healthcheck }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: immersa-presentations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install PDF conversion tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Exercise real account sessions, HTTP, Socket.IO and database constraints
        env:
          IMMERSA_EVENTS_V2_TEST_DATABASE_URL: mysql://root:isolated-ci-password@127.0.0.1:3306/events_v2_test
        run: node --test test/events-v2-integration.test.js

name: Event Hub Reconciliation Check

on:
  workflow_dispatch:

jobs:
  test:
    name: Repository tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: immersa-presentations
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: immersa-presentations/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test

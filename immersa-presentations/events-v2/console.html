<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Acceso · IMMERSA Eventos</title>
  <link rel="stylesheet" href="/events-v2/console.css">
  <script defer src="/events-v2/slides-console.js"></script>
  <script defer src="/events-v2/slides-page.js"></script>
  <script defer src="/events-v2/av-fx.js"></script><script defer src="/events-v2/av-console.js"></script>
  <script defer src="/events-v2/av-fade.js"></script><script defer src="/events-v2/av-page.js"></script>
  <script defer src="/events-v2/access-client.js"></script>
  <script defer src="/socket.io/socket.io.js"></script>
  <script defer src="/events-v2/live-console.js"></script>
  <script defer src="/events-v2/poll-console.js"></script>
  <script defer src="/events-v2/poll-page.js"></script>
  <script defer src="/events-v2/qna-console.js"></script>
  <script defer src="/events-v2/qna-page.js"></script>
  <script defer src="/events-v2/interaction-images.js"></script>
  <script defer src="/events-v2/knowledge-console.js"></script>
  <script defer src="/events-v2/knowledge-page.js"></script>
  <script defer src="/events-v2/raffle-console.js"></script>
  <script defer src="/events-v2/raffle-page.js"></script>
  <script defer src="/events-v2/game-time-console.js"></script>
  <script defer src="/events-v2/game-time-page.js"></script>
  <script defer src="/events-v2/emergency-menu.js"></script>
  <script defer src="/events-v2/console-page.js"></script>
</head>
<body>
  <main>
    <p class="brand">IMMERSA <span>Eventos</span></p>
    <p id="function">Acceso</p>
    <h1 id="event-name">Verificando acceso…</h1>
    <p id="access-status" role="status" aria-live="polite">Conectando con el evento.</p>
    <p id="access-detail"></p>
    <button id="retry" type="button" hidden>Volver a conectar</button>
    <div id="slides-language-controls" class="controls" hidden><button id="slides-language-es" type="button" lang="es">Español</button><button id="slides-language-en" type="button" lang="en">English</button></div>
    <p id="slides-status" role="status" aria-live="polite"></p><p id="slides-fallback"></p>
    <div id="slides-surface" hidden><img id="slides-image" alt="Slide" referrerpolicy="no-referrer" hidden><div id="av-output" hidden><video id="av-video" playsinline preload="metadata" hidden></video><audio id="av-audio" preload="metadata"></audio><div id="av-react-layer"></div><canvas id="av-drawing" width="960" height="540" aria-label="Trazo sobre la presentación"></canvas><p id="av-message-output" hidden></p><div id="av-reactions-output"></div></div></div>
    <section id="operation" hidden aria-label="Actividad">
      <div class="activity-row">
        <label for="activity">Actividad</label>
        <select id="activity"><option value="">Selecciona una actividad</option></select>
        <button id="refresh" type="button">Actualizar</button>
      </div>
      <p id="live-status" role="status" aria-live="polite"></p>
      <div id="position" hidden>
        <output id="live-position"></output>
        <p id="preview-position"></p>
      </div>
      <div id="navigation" class="controls" hidden>
        <button id="prev" type="button" aria-label="Slide anterior">Anterior</button>
        <button id="next" type="button" aria-label="Slide siguiente">Siguiente</button>
        <label for="slide-number">Slide</label>
        <input id="slide-number" type="number" min="1" inputmode="numeric">
        <button id="go" type="button">Ir</button>
        <button id="pause" type="button">Pausar transmisión</button>
      </div>
      <div id="stage-lifecycle" class="controls" hidden>
        <button id="start" type="button">Iniciar presentación</button>
        <button id="finish" type="button">Finalizar presentación</button>
      </div>
      <div id="slides-operator" hidden><figure><figcaption>Vista del control</figcaption><div id="slides-prompter-target" role="button" tabindex="-1" aria-label="Mantén pulsado para leer el apuntador"><img id="slides-preview" alt="Slide del control" draggable="false" hidden><div id="slides-prompter" hidden><div id="slides-notes-current"></div><div id="slides-notes-next" hidden></div></div></div></figure><figure><figcaption>Siguiente</figcaption><img id="slides-next" alt="Siguiente slide" hidden></figure></div>
      <section id="poll-panel" hidden aria-label="Encuesta">
        <div id="poll-controls" class="controls" hidden>
          <label for="poll-catalog">Encuesta</label><select id="poll-catalog"></select>
          <button id="poll-launch" type="button">Abrir encuesta</button>
          <button id="poll-show" type="button">Mostrar resultados</button>
          <button id="poll-hide" type="button">Ocultar resultados</button>
          <button id="poll-close" type="button">Cerrar encuesta</button>
        </div>
        <p id="poll-status" role="status" aria-live="polite"></p>
        <h2 id="poll-question"></h2>
        <div id="poll-options"></div>
        <button id="poll-submit" type="button" hidden>Enviar respuesta</button>
        <div id="poll-results"></div>
      </section>
      <section id="qna-panel" hidden aria-label="Preguntas y respuestas">
        <div id="qna-controls" class="controls" hidden>
          <button id="qna-open" type="button">Abrir Q&A</button>
          <button id="qna-intake" type="button">Cerrar recepción</button>
          <label for="qna-list">Preguntas</label><select id="qna-list"></select>
          <button id="qna-project" type="button">Proyectar</button>
          <button id="qna-delete" type="button">Eliminar</button>
          <button id="qna-hide" type="button">Ocultar Q&A</button>
          <button id="qna-new-round" type="button">Nueva ronda</button>
        </div>
        <p id="qna-status" role="status" aria-live="polite"></p>
        <div id="qna-public" hidden>
          <label for="qna-name">Tu nombre</label><input id="qna-name" type="text" maxlength="120" autocomplete="name">
          <label for="qna-question">Tu pregunta</label><textarea id="qna-question" maxlength="1000" rows="4"></textarea>
          <label class="qna-consent"><input id="qna-consent" type="checkbox">Permito mostrar mi nombre con esta pregunta</label>
          <p id="qna-cooldown" role="status"></p>
          <button id="qna-submit" type="button">Enviar pregunta</button>
        </div>
        <blockquote id="qna-output" hidden><p id="qna-projected-text"></p><cite id="qna-projected-name"></cite></blockquote>
      </section>
      <section id="knowledge-panel" hidden aria-label="Trivias y Evaluaciones">
        <div id="knowledge-controls" class="controls" hidden>
          <label for="knowledge-catalog">Trivia/Evaluación</label><select id="knowledge-catalog"></select>
          <button id="knowledge-open" type="button">Abrir actividad</button><button id="knowledge-start" type="button" hidden>Iniciar</button><button id="knowledge-finalize" type="button" hidden>Finalizar actividad</button><button id="knowledge-cancel" type="button" hidden>Cancelar actividad</button><button id="knowledge-show_results" type="button" hidden>Mostrar resultados</button><button id="knowledge-close" type="button" hidden>Cerrar resultados</button><button id="knowledge-retry_processing" type="button" hidden>Reintentar procesamiento</button><button id="knowledge-force_results" type="button" hidden>Forzar resultados</button>
        </div>
        <h2 id="knowledge-title"></h2><p id="knowledge-status" role="status" aria-live="polite"></p>
        <p id="knowledge-counts"></p><output id="knowledge-clock" aria-live="off"></output>
        <div id="knowledge-registration" hidden><label id="knowledge-name-label" for="knowledge-name">Tu nombre</label><input id="knowledge-name" type="text" maxlength="120" autocomplete="name"><button id="knowledge-join" type="button">Entrar</button></div>
        <p id="knowledge-tab-status" role="status"></p><button id="knowledge-claim" type="button" hidden>Continuar en esta pestaña</button>
        <p id="knowledge-progress"></p><h3 id="knowledge-question"></h3><div id="knowledge-image" hidden></div><div id="knowledge-options"></div>
        <p id="knowledge-answer-status" role="status"></p>
        <div id="knowledge-assessment-nav" class="controls" hidden><button id="knowledge-prev" type="button">Anterior</button><button id="knowledge-next" type="button">Siguiente</button></div>
        <button id="knowledge-submit" type="button" hidden>Enviar evaluación</button>
        <p id="knowledge-receipt" role="status"></p><div id="knowledge-results"></div>
      </section>
      <section id="raffle-panel" class="panel" hidden>
        <h2>Sorteos</h2><div id="raffle-controls">
          <label>Sorteo <select id="raffle-catalog"></select></label><button id="raffle-open" type="button">Abrir sorteo</button>
          <div id="raffle-key-controls"><label>Clave visual <select id="raffle-key"></select></label><div id="raffle-key-image" hidden></div><button id="raffle-configure-key" type="button">Guardar clave</button></div>
          <div class="controls"><button id="raffle-close_entries" type="button" hidden>Cerrar participación</button><button id="raffle-draw" type="button" hidden>Sortear</button><button id="raffle-reveal" type="button" hidden>Revelar ganador</button><button id="raffle-close" type="button" hidden>Cerrar sorteo</button><button id="raffle-reset_winners" type="button" hidden>Reiniciar ganadores</button></div></div>
        <h3 id="raffle-title"></h3><p id="raffle-status" role="status"></p><p id="raffle-prompt"></p><p id="raffle-counts"></p><p id="raffle-clock" role="timer"></p><p id="raffle-display-option"></p><div id="raffle-display-image" hidden></div>
        <div id="raffle-registration"><label>Tu nombre <input id="raffle-name" maxlength="120" autocomplete="name"></label><button id="raffle-enter" type="button">Participar</button></div>
        <div id="raffle-options" class="controls"></div><p id="raffle-receipt" role="status"></p><p id="raffle-winner" role="status"></p>
      </section>
      <section id="game-panel" hidden aria-label="Juegos"><h2>Juegos</h2>
        <div id="game-operator" hidden><div id="game-catalog" class="controls"></div><div class="controls">
          <button id="game-start_queue" type="button">Abrir juegos</button><button id="game-start" type="button">Iniciar juego</button><button id="game-pause" type="button">Pausar juego</button><button id="game-resume" type="button">Continuar juego</button><button id="game-skip" type="button">Saltar juego</button><button id="game-end" type="button">Terminar juegos</button>
        </div><div id="game-team-names" class="controls"><label>Equipo izquierdo <input id="game-name-left" maxlength="24"></label><label>Equipo derecho <input id="game-name-right" maxlength="24"></label><button id="game-save-names" type="button">Guardar nombres</button></div></div>
        <p id="game-status" role="status"></p><p id="game-score"></p><output id="game-remaining"></output><p id="game-result" role="status"></p>
        <canvas id="game-board" width="960" height="540" aria-label="Juego en vivo" hidden></canvas>
        <p id="game-membership" role="status"></p><div id="game-team-choice" class="controls" hidden><button id="game-join-left" type="button"></button><button id="game-join-right" type="button"></button></div>
        <div id="game-inputs" class="controls" hidden><button id="game-input-left" type="button" aria-label="Mover a la izquierda">Izquierda</button><button id="game-input-right" type="button" aria-label="Mover a la derecha">Derecha</button><button id="game-input-up" type="button" aria-label="Mover arriba">Arriba</button><button id="game-input-down" type="button" aria-label="Mover abajo">Abajo</button></div>
      </section>
      <section id="time-panel" hidden aria-label="Tiempo"><h2>Time</h2><p id="time-status" role="status"></p><output id="time-screen-output" role="timer" aria-live="off" hidden></output>
        <div id="time-controls" hidden><div class="controls"><label>En Pantalla <select id="time-mode"><option value="stopwatch">Cronómetro</option><option value="countdown">Temporizador</option><option value="clock">Hora actual</option></select></label>
        <div id="time-duration" class="controls" hidden><label>Horas <input id="time-hours" type="number" min="0" max="99" value="0" inputmode="numeric"></label><label>Minutos <input id="time-minutes" type="number" min="0" max="59" value="5" inputmode="numeric"></label><label>Segundos <input id="time-seconds" type="number" min="0" max="59" value="0" inputmode="numeric"></label></div><button id="time-start" type="button">Mostrar tiempo</button>
        <button id="time-screen-stop" type="button">Pausar tiempo</button><button id="time-screen-resume" type="button">Continuar tiempo</button><button id="time-screen-reset" type="button">Reiniciar tiempo</button><button id="time-screen-hide" type="button">Ocultar tiempo</button></div></div>
        <div id="time-speaker" hidden><h3>Cronómetro de Speaker</h3><output id="time-speaker-output" role="timer" aria-live="off"></output><div class="controls"><button id="time-speaker-start" type="button">Iniciar cronómetro</button><button id="time-speaker-stop" type="button">Detener cronómetro</button><button id="time-speaker-reset" type="button">Reiniciar cronómetro</button></div></div>
      </section>
      <section id="av-panel" hidden aria-label="Audiovisual"><p id="av-status" role="status"></p>
        <div id="av-operator" hidden><button id="av-open" type="button">Audiovisual</button>
        <dialog id="av-dialog" aria-labelledby="av-title"><header class="av-modal-header"><h2 id="av-title">Audiovisual</h2><label class="av-master-volume">Volumen <input id="av-volume" type="range" min="0" max="100" value="100" aria-label="Volumen global de Audiovisual"></label><button id="av-stop-all" type="button">Stop global</button><button id="av-close" type="button" aria-label="Cerrar Audiovisual">Cerrar</button></header>
        <div class="av-tabs" role="tablist" aria-label="Categorías de Audiovisual"><button id="av-tab-audio" type="button" role="tab" aria-selected="true">Audio</button><button id="av-tab-video" type="button" role="tab" aria-selected="false">Video</button><button id="av-tab-fx" type="button" role="tab" aria-selected="false">FX</button></div>
        <div id="av-cards" class="av-media-grid"></div><div id="av-playlist-cards" class="av-playlist-grid"></div><div id="av-channel-controls"></div></dialog>
        <label>Mensaje <textarea id="av-message" maxlength="2000"></textarea></label><div class="controls"><button id="av-show-message" type="button">Mostrar mensaje</button><button id="av-clear-message" type="button">Borrar mensaje</button><button id="av-clear-screen" type="button">Limpiar overlays</button><button id="av-reactions-toggle" type="button">Reacciones</button><label><input id="av-drawing-enabled" type="checkbox">Dibujar</label></div><p id="av-counts"></p></div>

        <button id="av-activate" type="button" hidden>Activar audio y video</button><p id="av-media-status" role="status"></p>
        <div id="av-public-reactions" class="controls" hidden><button id="av-heart" type="button" aria-label="Enviar corazón">❤️</button><button id="av-clap" type="button" aria-label="Enviar aplauso">👏</button><button id="av-fire" type="button" aria-label="Enviar fuego">🔥</button></div><output id="av-own-reaction" aria-live="polite"></output>
      </section>
      <div id="interaction-emergency" hidden role="menu"><button id="interaction-emergency-action" type="button" role="menuitem"></button></div>
    </section>
    <dialog id="av-confirm-dialog" aria-labelledby="av-confirm-title"><h2 id="av-confirm-title"></h2><div class="controls"><button id="av-cancel" type="button">Cancelar</button><button id="av-confirm" type="button">Confirmar</button></div></dialog>
    <dialog id="game-time-confirm-dialog" aria-labelledby="game-time-confirm-title"><h2 id="game-time-confirm-title"></h2><div class="controls"><button id="game-time-cancel" type="button">Cancelar</button><button id="game-time-confirm" type="button">Confirmar</button></div></dialog>
    <dialog id="raffle-confirm-dialog" aria-labelledby="raffle-confirm-title"><h2 id="raffle-confirm-title"></h2><p id="raffle-confirm-detail"></p><div class="controls"><button id="raffle-cancel-confirm" type="button">Cancelar</button><button id="raffle-confirm" type="button">Confirmar</button></div></dialog>
    <dialog id="knowledge-confirm-dialog" aria-labelledby="knowledge-confirm-title">
      <h2 id="knowledge-confirm-title"></h2><p id="knowledge-confirm-detail"></p>
      <div class="controls"><button id="knowledge-cancel-confirm" type="button">Cancelar</button><button id="knowledge-confirm" type="button">Confirmar</button></div>
    </dialog>
    <dialog id="qna-confirm-dialog" aria-labelledby="qna-confirm-title">
      <h2 id="qna-confirm-title"></h2>
      <div class="controls"><button id="qna-cancel" type="button">Cancelar</button><button id="qna-confirm" type="button">Confirmar</button></div>
    </dialog>
    <dialog id="finish-dialog" aria-labelledby="finish-title">
      <h2 id="finish-title">¿Finalizar esta presentación?</h2>
      <p>Se cerrará la sesión en vivo de esta actividad.</p>
      <div class="controls">
        <button id="cancel-finish" type="button">Cancelar</button>
        <button id="confirm-finish" type="button">Finalizar</button>
      </div>
    </dialog>
  </main>
</body>
</html>

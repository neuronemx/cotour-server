<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Acceso · IMMERSA Eventos</title>
  <link rel="stylesheet" href="/events-v2/console.css">
  <script defer src="/events-v2/access-client.js"></script>
  <script defer src="/socket.io/socket.io.js"></script>
  <script defer src="/events-v2/live-console.js"></script>
  <script defer src="/events-v2/poll-console.js"></script>
  <script defer src="/events-v2/poll-page.js"></script>
  <script defer src="/events-v2/console-page.js"></script>
</head>
<body>
  <main>
    <p class="brand">IMMERSA <span>Eventos</span></p>
    <p id="function">Acceso</p>
    <h1 id="event-name">Verificando acceso…</h1>
    <p id="access-status" role="status" aria-live="polite">Conectando con el evento.</p>
    <p id="access-detail"></p>
    <button id="retry" type="button" hidden>Volver a conectar</button>
    <section id="operation" hidden aria-label="Actividad">
      <div class="activity-row">
        <label for="activity">Actividad</label>
        <select id="activity"><option value="">Selecciona una actividad</option></select>
        <button id="refresh" type="button">Actualizar</button>
      </div>
      <p id="live-status" role="status" aria-live="polite"></p>
      <div id="position" hidden>
        <output id="live-position"></output>
        <p id="preview-position"></p>
      </div>
      <div id="navigation" class="controls" hidden>
        <button id="prev" type="button" aria-label="Slide anterior">Anterior</button>
        <button id="next" type="button" aria-label="Slide siguiente">Siguiente</button>
        <label for="slide-number">Slide</label>
        <input id="slide-number" type="number" min="1" inputmode="numeric">
        <button id="go" type="button">Ir</button>
        <button id="pause" type="button">Pausar transmisión</button>
      </div>
      <div id="stage-lifecycle" class="controls" hidden>
        <button id="start" type="button">Iniciar presentación</button>
        <button id="finish" type="button">Finalizar presentación</button>
      </div>
      <p class="content-note">La visualización de los archivos privados aún no está disponible.</p>
      <section id="poll-panel" hidden aria-label="Encuesta">
        <div id="poll-controls" class="controls" hidden>
          <label for="poll-catalog">Encuesta</label><select id="poll-catalog"></select>
          <button id="poll-launch" type="button">Abrir encuesta</button>
          <button id="poll-show" type="button">Mostrar resultados</button>
          <button id="poll-hide" type="button">Ocultar resultados</button>
          <button id="poll-close" type="button">Cerrar encuesta</button>
        </div>
        <p id="poll-status" role="status" aria-live="polite"></p>
        <h2 id="poll-question"></h2>
        <div id="poll-options"></div>
        <button id="poll-submit" type="button" hidden>Enviar respuesta</button>
        <div id="poll-results"></div>
      </section>
      <div id="poll-emergency" hidden role="menu"><button id="poll-emergency-action" type="button" role="menuitem"></button></div>
    </section>
    <dialog id="finish-dialog" aria-labelledby="finish-title">
      <h2 id="finish-title">¿Finalizar esta presentación?</h2>
      <p>Se cerrará la sesión en vivo de esta actividad.</p>
      <div class="controls">
        <button id="cancel-finish" type="button">Cancelar</button>
        <button id="confirm-finish" type="button">Finalizar</button>
      </div>
    </dialog>
  </main>
</body>
</html>

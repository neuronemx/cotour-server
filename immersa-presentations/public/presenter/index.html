<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immersa Speaker</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/presenter/presenter.css">
  <link rel="stylesheet" href="/presenter/drawing-control.css">
  <link rel="stylesheet" href="/presenter/mobile-controls-tuning.css">
</head>
<body>
  <main class="presenter-shell">
    <p id="deckNotice" class="deck-notice" hidden>Esta presentación aún no ha sido convertida. Verás una pantalla provisional.</p>

    <section class="stream-area">
      <div class="brand-lockup" aria-label="Immersa">
        <img class="brand-mark" src="/presenter/immersa-mark.png" alt="Immersa">
      </div>
      <div class="top-actions" aria-label="Estado y vista">
        <button id="thumbsToggle" class="floating-action thumbs-toggle" type="button" aria-expanded="false" aria-controls="thumbs" title="Mostrar miniaturas" aria-label="Mostrar miniaturas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14"></path><path d="M5 12h14"></path><path d="M5 17h14"></path></svg>
        </button>
        <button id="fullscreenToggle" class="floating-action fullscreen-button" type="button" aria-pressed="false" title="Pantalla completa" aria-label="Pantalla completa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4"></path><path d="M4 4l5 5"></path><path d="M16 4h4v4"></path><path d="M20 4l-5 5"></path><path d="M8 20H4v-4"></path><path d="M4 20l5-5"></path><path d="M16 20h4v-4"></path><path d="M20 20l-5-5"></path></svg>
        </button>
        <div class="audience-stat" aria-label="Audiencia conectada"><span class="audience-icon">👥</span><span id="audience">0</span></div>
      </div>

      <img id="slide" alt="Lámina actual">
      <div id="reactions" class="reaction-layer"></div>

      <section class="main-controls" aria-label="Controles principales">
        <div class="nav-cluster">
          <button id="prev" class="control-button nav-button" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6L9 12L15 18"></path></svg></button>
          <span class="nav-divider" aria-hidden="true"></span>
          <button id="next" class="control-button nav-button" type="button" aria-label="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6L15 12L9 18"></path></svg></button>
        </div>

        <div class="slide-status" aria-label="Estado de transmisión">
          <div class="slide-count"><span id="current">1</span><span class="slide-divider">/</span><span id="total">3</span></div>
          <button id="playPause" class="status-pause-button" type="button" title="Pausar transmisión" aria-label="Pausar transmisión"><svg viewBox="0 0 24 24" aria-hidden="true" class="pause-icon"><path d="M9 6V18"></path><path d="M15 6V18"></path></svg></button>
        </div>

        <div class="fx-module" aria-label="Herramientas">
          <button id="audienceQr" class="control-button muted-button qr-button fx-btn" type="button" aria-pressed="false" title="Mostrar QR de público" aria-label="Mostrar QR de público">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20v.01"></path></svg>
          </button>
          <button id="drawToggle" class="control-button muted-button drawing-button fx-btn" type="button" aria-pressed="false" title="Trazo vivo" aria-label="Trazo vivo">
            <span class="drawing-icon" aria-hidden="true"></span>
          </button>
          <label class="control-button muted-button reaction-toggle fx-btn" aria-label="Ver reacciones en Presenter"><input id="localReactions" type="checkbox" checked><span>👏</span></label>
        </div>
      </section>
    </section>

    <nav id="thumbs" class="thumbs" aria-label="Miniaturas"></nav>

    <section class="links-panel" aria-label="URLs de sala">
      <label>Screen<input id="screenUrl" readonly></label>
      <label>Stage<input id="stageUrl" readonly></label>
      <label>Público<input id="audienceUrl" readonly></label>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/drawing-overlay.js"></script>
  <script src="/presenter/presenter.js"></script>
</body>
</html>

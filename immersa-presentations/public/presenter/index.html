<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immersa Presenter</title>
  <link rel="stylesheet" href="/presenter/presenter.css">
</head>
<body>
  <main class="shell">
    <section class="preview-panel">
      <div class="topline"><span>Immersa Presentations</span><strong id="status">Conectando</strong></div>
      <div class="slide-frame"><img id="slide" alt="Slide actual"></div>
      <div class="controls">
        <button id="prev">Anterior</button>
        <div class="slide-count"><span id="current">1</span>/<span id="total">3</span></div>
        <button id="next">Siguiente</button>
      </div>
      <form id="goForm" class="go-form">
        <label for="goInput">Ir al slide</label>
        <input id="goInput" type="number" min="1" value="1">
        <button type="submit">Ir</button>
      </form>
    </section>
    <aside class="side-panel">
      <div class="metric"><span>Audiencia</span><strong id="audience">0</strong></div>
      <div class="links">
        <h1>URLs de sala</h1>
        <label>Screen<input id="screenUrl" readonly></label>
        <label>Stage<input id="stageUrl" readonly></label>
        <label>Audience<input id="audienceUrl" readonly></label>
      </div>
      <div class="reaction-card">
        <h2>Reacciones</h2>
        <div id="reactions" class="reaction-stream"></div>
      </div>
    </aside>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/presenter/presenter.js"></script>
</body>
</html>

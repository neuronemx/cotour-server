          </svg>
        </button>
      </div>

      <img id="slide" alt="Lámina actual">
      <div class="interaction-slide-scrim" aria-hidden="true"></div>
      <div id="reactions" class="reaction-layer"></div>

        <div class="nav-cluster">
          <button id="prev" class="control-button nav-button" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6L9 12L15 18"></path></svg></button>
          <span class="nav-divider" aria-hidden="true"></span>
          <button id="next" class="control-button nav-button" type="button" aria-label="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6L15 12L9 18"></path></svg></button>
        </div>

    <section class="links-panel" aria-label="URLs de sala">

  <div id="presenterTextModal" class="controller-live-text-modal" aria-hidden="true">
    <div class="controller-live-text-backdrop" data-close-live-text></div>
    <section class="controller-live-text-card" role="dialog" aria-modal="true" aria-labelledby="presenterTextModalTitle">
      <div class="controller-live-text-head">
        <span>Speaker</span>
        <strong id="presenterTextModalTitle">Texto en vivo</strong>
      </div>
      <form id="presenterMessageForm" class="controller-live-text-form">
        <label for="presenterMessageInput">Mensaje en pantalla</label>
        <textarea id="presenterMessageInput" maxlength="90" rows="3" placeholder="Escribe un mensaje breve"></textarea>
        <small>Este mensaje aparece sobre la experiencia en vivo.</small>
        <div class="controller-live-text-actions">
          <button id="presenterDisplayLinkButton" type="button">Link Público</button>
          <button id="presenterCancelMessage" type="button">Cancelar</button>
          <button class="primary-action" type="submit">Mostrar texto</button>
        </div>
      </form>
    </section>

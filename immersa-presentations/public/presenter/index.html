<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immersa Presenter</title>
  <link rel="stylesheet" href="/presenter/presenter.css">
</head>
<body>
  <main class="presenter-shell">
    <header class="presenter-header">
      <div class="brand">IMMERSA</div>
      <div class="audience-stat">Audiencia: <span id="audience">0</span></div>
    </header>

    <section class="stream-area">
      <img id="slide" alt="Slide actual">
      <div id="reactions" class="reaction-layer"></div>
    </section>

    <nav id="thumbs" class="thumbs" aria-label="Miniaturas"></nav>

    <section class="main-controls" aria-label="Controles principales">
      <button id="prev" class="nav-button" type="button" aria-label="Anterior">‹</button>
      <label class="reaction-toggle" aria-label="Ver reacciones"><input id="localReactions" type="checkbox" checked><span>👏</span></label>
      <div class="slide-count"><span id="current">1</span>/<span id="total">3</span></div>
      <button id="playPause" class="play-button" type="button">⏸ Pausar</button>
      <button id="next" class="nav-button" type="button" aria-label="Siguiente">›</button>
    </section>

    <section class="links-panel" aria-label="URLs de sala">
      <label>Screen<input id="screenUrl" readonly></label>
      <label>Stage<input id="stageUrl" readonly></label>
      <label>Audience<input id="audienceUrl" readonly></label>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/presenter/presenter.js"></script>
</body>
</html>

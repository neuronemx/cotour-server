<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immersa Stage</title>
  <link rel="stylesheet" href="/stage/stage.css?v=stage-v3">
</head>
<body>
  <main class="stage-shell">
    <header class="stage-toolbar" aria-label="Setup y controles de Stage">
      <div class="stage-brand" aria-label="Immersa Stage">
        <img src="/stage/immersa-mark.png" alt="Immersa">
        <strong>Stage</strong>
      </div>

      <div class="presentation-name" aria-label="Presentación activa">
        <span id="stageDeckLabel">Presentación</span>
      </div>

      <div class="toolbar-status" aria-label="Estado de sesión">
        <span class="status-pill"><em>Público</em><strong id="audience">0</strong></span>
        <span class="status-pill"><em>Speaker</em><strong id="presenterStatus">Off</strong></span>
        <span class="status-pill"><em>Slide</em><strong><b id="current">1</b>/<b id="total">3</b></strong></span>
      </div>

      <div class="toolbar-actions" aria-label="Controles de pantalla">
        <label class="mini-switch">
          <input id="reactionsToggle" type="checkbox" checked>
          <span></span>
          <em>Reacciones</em>
        </label>
        <label class="mini-switch">
          <input id="qrToggle" type="checkbox">
          <span></span>
          <em>QR público</em>
        </label>
        <button id="liveTextButton" class="toolbar-button live-text" type="button" aria-haspopup="dialog">Texto en vivo</button>
      </div>
    </header>

    <section class="screen-stage" aria-label="Slide en vivo">
      <div class="screen-frame">
        <img id="slide" alt="Slide en vivo">

        <button id="prevSlide" class="slide-arrow slide-arrow-prev" type="button" aria-label="Slide anterior">‹</button>
        <button id="nextSlide" class="slide-arrow slide-arrow-next" type="button" aria-label="Siguiente slide">›</button>
      </div>
    </section>
  </main>

  <div id="textModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="textModalTitle">
      <div class="modal-head">
        <span>Stage</span>
        <strong id="textModalTitle">Texto en vivo</strong>
      </div>
      <form id="messageForm" class="message-form">
        <label for="messageInput">Mensaje en pantalla</label>
        <textarea id="messageInput" maxlength="90" rows="3" placeholder="Escribe un mensaje breve"></textarea>
        <small>Este mensaje aparece sobre la experiencia en vivo.</small>
        <div class="modal-actions">
          <button id="displayLinkButton" class="soft-action" type="button">Display link</button>
          <button id="cancelMessage" class="soft-action" type="button">Cancelar</button>
          <button class="primary-action" type="submit">Mostrar texto</button>
        </div>
      </form>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/stage/stage.js?v=stage-v3"></script>
</body>
</html>

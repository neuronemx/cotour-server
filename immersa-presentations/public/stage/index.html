<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immersa Stage</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/stage/stage.css?v=stage-v11">
  <link rel="stylesheet" href="/shared/controller-tools.css?v=1">
  <link rel="stylesheet" href="/shared/demo-plan-badge.css?v=2">
  <link rel="stylesheet" href="/shared/interactions.css?v=3">
  <link rel="stylesheet" href="/shared/raffle-controller.css">
  <link rel="stylesheet" href="/shared/qna-controls.css">
  <link rel="stylesheet" href="/shared/knowledge-activities.css?v=19">
  <link rel="stylesheet" href="/shared/presentation-lifecycle.css?v=1">
</head>
<body>
  <main class="stage-shell">
    <header class="stage-toolbar" aria-label="Setup y controles de Stage">
      <div class="stage-brand" aria-label="Immersa Stage">
        <img src="/stage/immersa-mark.png" alt="Immersa">
        <strong>Stage</strong>
      </div>
      <div id="presentationLifecycle" class="presentation-lifecycle-host stage-lifecycle-host" hidden></div>

      <div class="presentation-name" aria-label="Presentación activa">
        <span id="stageDeckLabel">Presentación</span>
      </div>

      <div class="toolbar-status" aria-label="Estado de sesión">
        <span class="status-pill"><em>Público</em><strong id="audience">0</strong></span>
      </div>

      <div class="toolbar-actions" aria-label="Controles de pantalla">
        <label class="mini-switch">
          <input id="reactionsToggle" type="checkbox" checked>
          <span></span>
          <em>Reacciones</em>
        </label>
        <label class="mini-switch">
          <input id="qrToggle" type="checkbox">
          <span></span>
          <em>QR</em>
        </label>
      </div>
    </header>

    <section id="stageThumbsPanel" class="stage-thumbs-panel is-open" aria-label="Navegación por slides">
      <button id="stageThumbsToggle" class="stage-thumbs-toggle" type="button" aria-expanded="true" aria-controls="stageThumbs">
        <span>Slides</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <nav id="stageThumbs" class="stage-thumbs" aria-label="Miniaturas de slides"></nav>
    </section>

    <section class="screen-stage" aria-label="Slide en vivo">
      <div class="screen-frame">
        <img id="slide" alt="Slide en vivo">
        <div class="interaction-slide-scrim" aria-hidden="true"></div>
        <div id="stageLiveText" class="live-text-overlay" hidden></div>
        <div id="stageQr" class="stage-qr-overlay" hidden>
          <div id="stageQrPattern" class="stage-qr-pattern" aria-label="QR Immersa Live"></div>
          <strong>Immersa Live</strong>
          <span id="stageQrUrl"></span>
        </div>

        <div class="stage-slide-tools" aria-label="Herramientas de Stage">
          <button id="stageActionsButton" class="toolbar-button actions-button" type="button" aria-haspopup="dialog" aria-expanded="false">Acciones<span class="plan-feature-lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></span></button>
          <button id="liveTextButton" class="toolbar-button live-text" type="button" aria-haspopup="dialog">Texto en vivo</button>
        </div>

        <section class="main-controls" aria-label="Controles principales">
          <button id="prevSlide" class="control-button nav-button" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6L9 12L15 18"></path></svg></button>
          <div class="slide-status" aria-label="Estado de transmisión">
            <div class="slide-count"><span id="current">1</span><span class="slide-divider">/</span><span id="total">3</span></div>
            <button id="stageTransmissionToggle" class="status-pause-button" type="button" title="Pausar transmisión" aria-label="Pausar transmisión"><svg viewBox="0 0 24 24" aria-hidden="true" class="pause-icon"><path d="M9 6V18"></path><path d="M15 6V18"></path></svg></button>
          </div>
          <button id="nextSlide" class="control-button nav-button" type="button" aria-label="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6L15 12L9 18"></path></svg></button>
        </section>

        <div id="stageAudioControls" class="stage-audio-controls-host" aria-label="Control de audio"></div>
</div>
    </section>
  </main>

  <div id="textModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-live-text></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="textModalTitle">
      <div class="modal-head">
        <strong id="textModalTitle">Texto en vivo</strong>
      </div>
      <form id="messageForm" class="message-form">
        <label for="messageInput">Este mensaje aparecerá en vivo para todos.</label>
        <textarea id="messageInput" maxlength="90" rows="3" placeholder="Escribe un mensaje breve"></textarea>
        <div class="modal-actions">
          <button class="primary-action" type="submit">Mostrar texto</button>
          <button id="cancelMessage" class="soft-action" type="button">Cancelar</button>
        </div>
      </form>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="/shared/slide-confirm.js?v=113"></script>
  <script src="/shared/presentation-lifecycle-control.js?v=1"></script>
  <script src="/shared/interactions-shell.js?v=2"></script>
  <script src="/shared/raffle-controller.js?v=2"></script>
  <script src="/shared/drawing-overlay.js"></script>
  <script src="/shared/live-text-control.js?v=1"></script>
  <script src="/shared/qna-controls.js"></script>
  <script src="/shared/knowledge-activities.js?v=26"></script>
  <script src="/shared/demo-plan-badge.js?v=1"></script>
  <script src="/stage/stage.js?v=stage-v16"></script>
  <script src="/shared/stage-game-audio.js?v=1"></script>
</body>
</html>

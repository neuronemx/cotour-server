<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IMMERSA Event Hub</title>
  <link rel="stylesheet" href="/event/event.css?v=6">
  <style>
    .sheet-detail .sheet-badge-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sheet-detail .sheet-time{color:var(--muted);font-size:12.5px;font-weight:600}.sheet-detail .sheet-location{display:flex;align-items:center;gap:6px;margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:500}.sheet-detail .sheet-location svg{width:15px;height:15px;flex:0 0 15px;fill:none;stroke:var(--muted2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sheet-detail.type-CONFERENCE .type{background:rgba(139,92,246,.16);color:#c4b0fb}.sheet-detail.type-MASTER_CLASS .type{background:rgba(59,130,246,.16);color:#a9c8fe}.sheet-detail.type-ROUND_TABLE .type{background:rgba(34,211,238,.16);color:#8feefb}.sheet-detail.type-WORKSHOP .type{background:rgba(236,72,153,.16);color:#f6a9ce}.sheet-detail.type-PANEL .type{background:rgba(245,158,11,.16);color:#fcd58d}.sheet-detail.type-OTHER .type{background:rgba(148,163,184,.16);color:#cbd5e1}
    .daytab{appearance:none;-webkit-appearance:none;overflow:hidden}.daytab.active{border:0;padding:10px 17px;background:linear-gradient(90deg,var(--violet),var(--blue),var(--cyan));background-clip:padding-box;box-shadow:none}
    .program:not(.event-program-ready){visibility:hidden}
  </style>
</head>
<body>
  <header class="event-top">
    <div class="brandrow"><img class="brand-logo" src="/audience/immersa-mark.png" alt="IMMERSA"></div>
    <h1 id="event-title">Cargando evento…</h1>
    <p id="event-level" class="access-pill"></p>
  </header>
  <main class="event-shell">
    <section id="registration" class="registration-card">
      <h2>Registro</h2>
      <p>Regístrate para acceder al contenido disponible durante el evento.</p>
      <form id="registration-form">
        <label>¿Cómo quieres que te llamemos?<input id="registration-key" required autocomplete="name" maxlength="120" placeholder="Tu nombre"></label>
        <button type="submit">Continuar</button>
      </form>
    </section>
    <section class="program">
      <nav id="day-tabs" class="daytabs" aria-label="Días del programa"></nav>
      <div id="legend" class="legend"></div>
      <div id="day-panels"></div>
    </section>
  </main>
  <div id="speaker-overlay" class="overlay" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <button id="sheet-close" class="sheet-close" type="button" aria-label="Cerrar">×</button>
      <div class="sheet-handle"></div>
      <div id="sheet-content"></div>
    </section>
  </div>
  <script>window.IMMERSA_EVENT_PUBLIC = null;</script>
  <script src="/event/event.js?v=6"></script>
</body>
</html>

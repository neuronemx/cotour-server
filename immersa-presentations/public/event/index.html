<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMMERSA Event Hub</title>
  <link rel="stylesheet" href="/event/event.css">
</head>
<body>
  <main class="event-shell">
    <p class="eyebrow">IMMERSA · EVENT HUB</p>
    <h1 id="event-title">Cargando evento…</h1>
    <p id="event-level" class="level"></p>
    <section id="registration" class="card">
      <h2>Registro</h2>
      <p>Regístrate para acceder al contenido disponible durante el evento.</p>
      <form id="registration-form">
        <label>¿Cómo quieres que te llamemos?<input id="registration-key" required autocomplete="name" maxlength="120" placeholder="Tu nombre"></label>
        <button type="submit">Continuar</button>
      </form>
    </section>
    <section class="activities">
      <h2>Programa</h2>
      <div id="activity-list" class="activity-list"></div>
    </section>
  </main>
  <script>window.IMMERSA_EVENT_PUBLIC = null;</script>
  <script src="/event/event.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Immersa Screen</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/screen/screen.css">
  <link rel="stylesheet" href="/shared/interactions.css">
  <link rel="stylesheet" href="/shared/public-code-display.css?v=101">
  <link rel="stylesheet" href="/shared/knowledge-activities.css?v=14">
</head>
<body>
  <main id="screen" class="screen">
    <img id="slide" alt="Slide en pantalla">
    <button id="fullscreenToggle" class="fullscreen-toggle" type="button" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
    <div id="message" class="message hidden"></div>
    <div id="qr" class="qr hidden"><div id="qrPattern" class="qr-pattern" aria-label="QR Immersa Live"></div><strong>Immersa Live</strong><span id="audienceUrl"></span></div>
    <div id="reactions" class="reactions"></div>
    <section id="qnaOverlay" class="qna-screen-overlay" aria-live="polite" hidden>
      <div class="qna-screen-card">
        <img class="qna-screen-icon" src="/shared/qna-question-icon.svg" alt="">
        <div class="qna-screen-copy">
          <p id="qnaQuestion"></p>
          <span id="qnaName" hidden></span>
        </div>
      </div>
    </section>
  </main>
  <section id="knowledgeActivityScreen" class="knowledge-screen-overlay" aria-live="polite" hidden></section>
  <script src="/socket.io/socket.io.js"></script><script src="/shared/raffle-public-ui.js"></script><script src="/shared/raffle-ux-adjustments.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="/shared/drawing-overlay.js"></script><script src="/shared/knowledge-activities.js?v=17"></script><script src="/screen/screen.js?v=4"></script><script src="/screen/screen-local-file-picker-adapter.js?v=113"></script><script src="/screen/screen-local-media-persistence-fix.js?v=111"></script><script src="/screen/screen-local-media.js?v=111"></script><script src="/screen/screen-multimedia-modal-polish.js?v=113"></script><script src="/screen/screen-media-unlock-host.js?v=107"></script><script src="/shared/video-deck-config-bridge.js?v=107"></script><script src="/shared/public-code-display.js?v=101"></script><script src="/shared/breakout-audio.js?v=98"></script><script src="/shared/pong-audio.js?v=2"></script>
</body></html>

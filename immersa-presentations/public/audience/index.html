<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Immersa Audience</title><link rel="stylesheet" href="/audience/audience.css"></head>
<body>
  <main id="viewer" class="audience"><section id="slideViewport" class="slide-viewport" aria-label="Slide actual"><img id="slide" alt="Slide actual" draggable="false"></section><div id="reactions" class="reaction-layer"></div><div class="top-actions"><button id="fullscreen" class="icon-action" type="button" aria-label="Pantalla completa" title="Pantalla completa">⛶</button><button id="snapshot" class="snapshot" type="button" aria-label="Snapshot" title="Snapshot">📷<span>Snapshot</span></button></div><nav class="reaction-bar" aria-label="Reacciones"><button data-emoji="❤️" aria-label="Enviar corazón">❤️</button><button data-emoji="👏" aria-label="Enviar aplauso">👏</button><button data-emoji="🔥" aria-label="Enviar fuego">🔥</button></nav></main>
  <script src="/socket.io/socket.io.js"></script><script src="/audience/audience.js"></script>
</body></html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immersa Live</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/audience/audience.css">
  <link rel="stylesheet" href="/shared/interactions.css">
  <link rel="stylesheet" href="/shared/public-code-display.css?v=102">
</head>
<body>
  <main id="viewer" class="audience">
    <section id="slideViewport" class="slide-viewport" aria-label="Slide actual"><img id="slide" alt="Slide actual" draggable="false"></section>
    <div class="interaction-slide-scrim" aria-hidden="true"></div>
    <a class="brand-lockup" href="https://immersa.mx" target="_blank" rel="noopener noreferrer" aria-label="Abrir Immersa"><img class="brand-mark" src="/audience/immersa-mark.png" alt="Immersa"></a>
    <div id="connectionNotice" class="disconnect hidden" role="status">Conexión pausada. Recarga la página para volver a entrar.</div>
    <div id="liveMessage" class="live-message hidden" role="status"></div>
    <div id="reactions" class="reaction-layer"></div>
    <div class="top-actions">
      <button id="snapshot" class="icon-action snapshot" type="button" aria-label="Captura pantalla" title="Captura pantalla"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 7.5 7H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2.5L15 5H9Z"></path><circle cx="12" cy="13" r="3.25"></circle></svg></button>
      <button id="fullscreen" class="icon-action" type="button" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
    </div>
    <nav class="reaction-bar" aria-label="Reacciones"><button data-emoji="❤️" aria-label="Enviar corazón">❤️</button><button data-emoji="👏" aria-label="Enviar aplauso">👏</button><button data-emoji="🔥" aria-label="Enviar fuego">🔥</button></nav>
  </main>
  <script src="/socket.io/socket.io.js"></script><script src="/shared/raffle-public-ui.js"></script><script src="/shared/raffle-ux-adjustments.js"></script><script src="/shared/drawing-overlay.js"></script><script src="/audience/audience.js"></script><script src="/shared/video-slide-runtime.js?v=103"></script><script src="/shared/public-code-display.js?v=102"></script>
</body></html>

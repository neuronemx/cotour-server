services:
  mariadb:
    image: mariadb:11.4
    env_file:
      - .env.local-demo
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - immersa-local-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  immersa-app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local-demo
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${IMMERSA_LOCAL_PORT:-3000}:8080"
    volumes:
      - immersa-local-data:/data
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    restart: unless-stopped

volumes:
  immersa-local-data:
    name: immersa-local-data
  immersa-local-mariadb:
    name: immersa-local-mariadb
